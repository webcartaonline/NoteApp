<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteApp</title>
<meta name="description" content="Aplicación para tomar notas y crear recordatorios">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NoteApp">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<!-- Estilos: generales, estructura principal y uno por componente -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="componentes/cabecera/cabecera.css">
<link rel="stylesheet" href="componentes/barra-lateral/barra-lateral.css">
<link rel="stylesheet" href="componentes/barra-hojas/barra-hojas.css">
<link rel="stylesheet" href="componentes/hoja-vacia/hoja-vacia.css">
<link rel="stylesheet" href="componentes/panel-texto/panel-texto.css">
<link rel="stylesheet" href="componentes/lineas/lineas.css">
<link rel="stylesheet" href="componentes/entidad-separador/entidad-separador.css">
<link rel="stylesheet" href="componentes/entidad-cabecera/entidad-cabecera.css">
<link rel="stylesheet" href="componentes/entidad-texto/entidad-texto.css">
<link rel="stylesheet" href="componentes/entidad-aviso/entidad-aviso.css">
<link rel="stylesheet" href="componentes/entidad-expresion/entidad-expresion.css">
<link rel="stylesheet" href="componentes/entidad-interruptor/entidad-interruptor.css">
<link rel="stylesheet" href="componentes/entidad-deslizador/entidad-deslizador.css">
<link rel="stylesheet" href="componentes/entidad-porcentaje/entidad-porcentaje.css">
<link rel="stylesheet" href="componentes/entidad-logica/entidad-logica.css">
<link rel="stylesheet" href="componentes/entidad-calendario/entidad-calendario.css">
<link rel="stylesheet" href="componentes/entidad-contador/entidad-contador.css">
<link rel="stylesheet" href="componentes/entidad-tabla/entidad-tabla.css">
<link rel="stylesheet" href="componentes/entidades/entidades.css">
<link rel="stylesheet" href="componentes/mensajes/mensajes.css">
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
<!-- Arranque: descarga los componentes (carpeta componentes/) y luego el motor (support.js) -->
<script src="js/arranque.js"></script>
</head>
<body>
<!-- Estructura principal. Cada <dc-import name="x"> es un componente: componentes/x/x.html (+ x.css).
     dc-props="{{ ui }}" le pasa todos los valores de renderVals() (js/app/render.js). -->
<x-dc>
<div class="app-caja">
  <dc-import name="cabecera" dc-props="{{ ui }}"></dc-import>
  <dc-import name="barra-lateral" dc-props="{{ ui }}"></dc-import>
  <main class="app-principal">
    <dc-import name="barra-hojas" dc-props="{{ ui }}"></dc-import>
    <sc-if value="{{ noSheet }}" hint-placeholder-val="{{ false }}">
      <dc-import name="hoja-vacia" dc-props="{{ ui }}"></dc-import>
    </sc-if>
    <sc-if value="{{ hasSheet }}" hint-placeholder-val="{{ true }}">
    <div class="app-caja-2">
      <sc-if value="{{ isNotas }}" hint-placeholder-val="{{ true }}"><dc-import name="panel-texto" dc-props="{{ ui }}"></dc-import></sc-if>
      <dc-import name="entidades" dc-props="{{ ui }}"></dc-import>
    </div>
    </sc-if>
  </main>
  <dc-import name="mensajes" dc-props="{{ ui }}"></dc-import>
</div>
</x-dc>
<!-- La lógica de la app está repartida en js/app/*.js; aquí solo se juntan las partes. -->
<script type="text/x-dc" data-dc-script>
const Component = NoteApp.crearComponente(DCLogic);
</script>
<!-- Funciones generales (motor) y partes de la app. El orden importa. -->
<script src="js/motor/menciones.js"></script>
<script src="js/motor/formulas.js"></script>
<script src="js/motor/mkd.js"></script>
<script src="js/motor/renombrar.js"></script>
<script src="js/motor/ids.js"></script>
<script src="js/motor/guardado.js"></script>
<script src="js/app/estado-inicial.js"></script>
<script src="js/app/base.js"></script>
<script src="js/app/carpeta.js"></script>
<script src="js/app/avisos.js"></script>
<script src="js/app/entidades.js"></script>
<script src="js/app/vista-entidades.js"></script>
<script src="js/app/pestanas.js"></script>
<script src="js/app/seleccion.js"></script>
<script src="js/app/lineas.js"></script>
<script src="js/app/render.js"></script>
</body>
</html>
