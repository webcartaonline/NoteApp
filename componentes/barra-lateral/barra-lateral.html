<!-- Componente "barra-lateral" de NoteApp. Barra lateral: interruptor Notas/Agenda, botones para añadir entidades, carpeta de guardado y ajustes.
     Los estilos fijos están en barra-lateral.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <aside class="barra-lateral-lateral">
    <button onClick="{{ toggleMode }}" aria-label="Cambiar modo" class="barra-lateral-cambiar-modo">
      <span class="barra-lateral-texto" style="left:0;top:{{ pillTop }};"></span>
      <span class="barra-lateral-texto-2"></span>
      <span class="barra-lateral-texto-3"></span>
    </button>
    <sc-if value="{{ isNotas }}" hint-placeholder-val="{{ true }}">
      <div class="barra-lateral-caja">
        <button onClick="{{ addTable }}" aria-label="Añadir tabla" title="Tabla" class="barra-lateral-anadir-tabla"></button>
        <button onClick="{{ addExpr }}" aria-label="Añadir expresión" title="Expresión" class="barra-lateral-anadir-expresion"></button>
        <button onClick="{{ addToggle }}" aria-label="Añadir interruptor" title="Interruptor" class="barra-lateral-anadir-interruptor"></button>
        <button onClick="{{ addLogic }}" aria-label="Añadir lógica" title="Lógica" class="barra-lateral-anadir-logica"></button>
        <button onClick="{{ addSlider }}" aria-label="Añadir deslizador" title="Deslizador" class="barra-lateral-anadir-deslizador"></button>
        <button onClick="{{ addPct }}" aria-label="Añadir porcentaje" title="Porcentaje" class="barra-lateral-anadir-porcentaje"></button>
        <button onClick="{{ addSep }}" aria-label="Añadir separador" title="Separador" class="barra-lateral-anadir-separador"><span class="barra-lateral-texto-4"></span><span class="barra-lateral-texto-5"></span><span class="barra-lateral-texto-4"></span></button>
      </div>
    </sc-if>
    <sc-if value="{{ isAgenda }}" hint-placeholder-val="{{ false }}">
      <div class="barra-lateral-caja">
        <button onClick="{{ addDate }}" aria-label="Calendario" title="Calendario" class="barra-lateral-calendario"></button>
        <button onClick="{{ addCount }}" aria-label="Contador" title="Contador" class="barra-lateral-contador"></button>
        <button onClick="{{ addNotif }}" aria-label="Notificación" title="Notificación" class="barra-lateral-notificacion"></button>
        <button onClick="{{ addCheck }}" aria-label="Casilla True/False" title="Casilla True/False" class="barra-lateral-anadir-interruptor"></button>
        <button onClick="{{ addLogic }}" aria-label="Lógica" title="Lógica" class="barra-lateral-anadir-logica"></button>
        <button onClick="{{ addText }}" aria-label="Añadir texto" title="Texto" class="barra-lateral-anadir-texto"></button>
        <button onClick="{{ addSep }}" aria-label="Añadir separador" title="Separador" class="barra-lateral-anadir-separador"><span class="barra-lateral-texto-4"></span><span class="barra-lateral-texto-5"></span><span class="barra-lateral-texto-4"></span></button>
      </div>
    </sc-if>
    <button onClick="{{ fsPick }}" aria-label="Carpeta de guardado" title="{{ fsTitle }}" class="barra-lateral-carpeta-guardado">
      <span class="barra-lateral-texto-6" style="background:{{ fsIcon }};"></span>
      <span class="barra-lateral-texto-7" style="background:{{ fsDot }};"></span>
    </button>
    <button aria-label="Ajustes" class="barra-lateral-ajustes"></button>
  </aside>
</x-dc>
