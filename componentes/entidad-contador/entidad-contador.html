<!-- Componente "entidad-contador" de NoteApp. Entidad Contador (tiempo hasta una fecha).
     Los estilos fijos están en entidad-contador.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <div class="entidad-contador-caja"><div class="entidad-contador-caja-2"><sc-if value="{{ e.entDirty }}" hint-placeholder-val="{{ false }}"><div class="entidad-contador-caja-3"><span class="entidad-contador-texto">{{ e.descSizer }}</span><input value="{{ e.desc }}" onChange="{{ e.onDesc }}" maxLength="120" spellCheck="false" class="entidad-contador-campo"></div><div class="entidad-contador-caja-4"></div></sc-if><sc-if value="{{ e.headClean }}" hint-placeholder-val="{{ false }}"><div class="entidad-contador-caja-5"><span title="{{ e.desc }}" class="entidad-contador-texto-2">{{ e.desc }}</span></div></sc-if><sc-if value="{{ e.entDirty }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="Unidad de salida" class="entidad-contador-unidad-salida"><sc-for list="{{ e.units }}" as="m" hint-placeholder-count="4"><button role="radio" aria-checked="{{ m.on }}" onClick="{{ m.onClick }}" title="{{ m.title }}" class="entidad-contador-opcion" style="background:{{ m.bg }};color:{{ m.color }};font:inherit;font-size:13px;font-weight:{{ m.fw }};">{{ m.label }}</button></sc-for></div></sc-if><div class="entidad-contador-caja-6">{{ e.outTxt }}</div></div><sc-if value="{{ e.entDirty }}" hint-placeholder-val="{{ false }}"><div class="entidad-contador-caja-7"><span class="entidad-contador-referencia">Referencia</span><div role="radiogroup" aria-label="Referencia de la cuenta atrás" class="entidad-contador-referencia-cuenta-atras"><sc-for list="{{ e.refs }}" as="m" hint-placeholder-count="3"><button role="radio" aria-checked="{{ m.on }}" onClick="{{ m.onClick }}" title="{{ m.title }}" class="entidad-contador-opcion" style="background:{{ m.bg }};color:{{ m.color }};font:inherit;font-size:13px;font-weight:{{ m.fw }};">{{ m.label }}</button></sc-for></div></div></sc-if><div class="entidad-contador-caja-8"><sc-if value="{{ e.headClean }}" hint-placeholder-val="{{ false }}"><span class="entidad-contador-referencia">{{ e.lead }}</span></sc-if><sc-if value="{{ e.entDirty }}" hint-placeholder-val="{{ false }}"><div title="Texto del contador" class="entidad-contador-texto-contador"><span class="entidad-contador-texto-3">{{ e.leadSizer }}</span><input value="{{ e.leadTxt }}" placeholder="{{ e.leadDef }}" onChange="{{ e.onLead }}" maxLength="40" spellCheck="false" class="entidad-contador-campo-2"></div></sc-if><sc-if value="{{ e.entDirty }}" hint-placeholder-val="{{ false }}"><div title="Fecha objetivo" class="entidad-contador-fecha-objetivo"><div class="entidad-contador-caja-9"><div class="entidad-contador-caja-10" style="justify-content:{{ e.ft.justify }};visibility:{{ e.ft.hlVis }};"><sc-for list="{{ e.ft.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></div><input value="{{ e.ft.value }}" spellCheck="false" onChange="{{ e.ft.onChange }}" onFocus="{{ e.ft.onFocus }}" onBlur="{{ e.ft.onBlur }}" onKeyDown="{{ e.ft.onKey }}" class="entidad-contador-campo-3" style="text-align:{{ e.ft.align }};opacity:{{ e.ft.inOp }};"></div></div></sc-if><sc-if value="{{ e.headClean }}" hint-placeholder-val="{{ false }}"><div class="entidad-contador-caja-11"><sc-for list="{{ e.tSegs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};font-weight:{{ s.fw }};">{{ s.text }}</span></sc-for></div></sc-if></div><div class="entidad-contador-caja-12"><sc-for list="{{ e.tiles }}" as="t" hint-placeholder-count="4"><div class="entidad-contador-caja-13"><span class="entidad-contador-texto-4" style="color:{{ t.color }};">{{ t.v }}</span><span class="entidad-contador-texto-5">{{ t.l }}</span></div></sc-for></div></div>
</x-dc>
