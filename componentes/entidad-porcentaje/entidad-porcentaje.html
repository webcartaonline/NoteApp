<!-- Componente "entidad-porcentaje" de NoteApp. Entidad Porcentaje.
     Los estilos fijos están en entidad-porcentaje.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <sc-if value="{{ e.pctClean }}" hint-placeholder-val="{{ false }}"><div class="entidad-porcentaje-caja"><div class="entidad-porcentaje-caja-2"><div class="entidad-porcentaje-caja-3"><span title="{{ e.desc }}" class="entidad-porcentaje-texto">{{ e.desc }}</span></div><div class="entidad-porcentaje-caja-4">{{ e.outTxt }}</div></div><div class="entidad-porcentaje-caja-5"><sc-for list="{{ e.sent }}" as="p" hint-placeholder-count="6"><sc-if value="{{ p.isWord }}" hint-placeholder-val="{{ true }}"><span class="entidad-porcentaje-texto-2">{{ p.text }}</span></sc-if><sc-if value="{{ p.isField }}" hint-placeholder-val="{{ false }}"><div title="{{ p.label }}" class="entidad-porcentaje-caja-6"><div class="entidad-porcentaje-caja-7"><div class="entidad-porcentaje-caja-8" style="justify-content:{{ p.f.justify }};visibility:{{ p.f.hlVis }};text-decoration:{{ p.f.deco }};"><sc-for list="{{ p.f.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></div><input value="{{ p.f.value }}" spellCheck="false" onChange="{{ p.f.onChange }}" onFocus="{{ p.f.onFocus }}" onBlur="{{ p.f.onBlur }}" onKeyDown="{{ p.f.onKey }}" class="entidad-porcentaje-campo" style="text-align:{{ p.f.align }};opacity:{{ p.f.inOp }};"></div></div></sc-if><sc-if value="{{ p.isVal }}" hint-placeholder-val="{{ false }}"><span title="{{ p.label }}" class="entidad-porcentaje-texto-3"><sc-for list="{{ p.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></span></sc-if><sc-if value="{{ p.isOut }}" hint-placeholder-val="{{ false }}"><span title="Resultado" class="entidad-porcentaje-resultado" style="flex:{{ p.flex }};height:{{ p.h }};justify-content:{{ p.justify }};">{{ p.text }}</span></sc-if></sc-for></div></div></sc-if>
  <sc-if value="{{ e.pctDirty }}" hint-placeholder-val="{{ false }}"><div class="entidad-porcentaje-caja"><div class="entidad-porcentaje-caja-9"><div class="entidad-porcentaje-caja-10"><span class="entidad-porcentaje-texto-4">{{ e.descSizer }}</span><input value="{{ e.desc }}" onChange="{{ e.onDesc }}" maxLength="120" spellCheck="false" class="entidad-porcentaje-campo-2"></div><div class="entidad-porcentaje-caja-11"></div><div role="radiogroup" aria-label="Qué calcular" class="entidad-porcentaje-calcular"><sc-for list="{{ e.modes }}" as="m" hint-placeholder-count="3"><button role="radio" aria-checked="{{ m.on }}" onClick="{{ m.onClick }}" title="{{ m.title }}" class="entidad-porcentaje-opcion" style="background:{{ m.bg }};color:{{ m.color }};font:inherit;font-size:13px;font-weight:{{ m.fw }};">{{ m.label }}</button></sc-for></div><div class="entidad-porcentaje-caja-4">{{ e.outTxt }}</div></div><div class="entidad-porcentaje-caja-5"><sc-for list="{{ e.sent }}" as="p" hint-placeholder-count="6"><sc-if value="{{ p.isWord }}" hint-placeholder-val="{{ true }}"><span class="entidad-porcentaje-texto-2">{{ p.text }}</span></sc-if><sc-if value="{{ p.isField }}" hint-placeholder-val="{{ false }}"><div title="{{ p.label }}" class="entidad-porcentaje-caja-6"><div class="entidad-porcentaje-caja-7"><div class="entidad-porcentaje-caja-8" style="justify-content:{{ p.f.justify }};visibility:{{ p.f.hlVis }};text-decoration:{{ p.f.deco }};"><sc-for list="{{ p.f.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></div><input value="{{ p.f.value }}" spellCheck="false" onChange="{{ p.f.onChange }}" onFocus="{{ p.f.onFocus }}" onBlur="{{ p.f.onBlur }}" onKeyDown="{{ p.f.onKey }}" class="entidad-porcentaje-campo" style="text-align:{{ p.f.align }};opacity:{{ p.f.inOp }};"></div></div></sc-if><sc-if value="{{ p.isVal }}" hint-placeholder-val="{{ false }}"><span title="{{ p.label }}" class="entidad-porcentaje-texto-3"><sc-for list="{{ p.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></span></sc-if><sc-if value="{{ p.isOut }}" hint-placeholder-val="{{ false }}"><span title="Resultado" class="entidad-porcentaje-resultado" style="flex:{{ p.flex }};height:{{ p.h }};justify-content:{{ p.justify }};">{{ p.text }}</span></sc-if></sc-for></div></div></sc-if>
</x-dc>
