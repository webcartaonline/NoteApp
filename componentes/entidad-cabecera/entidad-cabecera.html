<!-- Componente "entidad-cabecera" de NoteApp. Cabecera de cada entidad en la vista sucia: icono, nombre, decimales, función, menú y flechas.
     Los estilos fijos están en entidad-cabecera.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <div class="entidad-cabecera-caja">
    <span class="entidad-cabecera-texto" style="mask:url({{ e.icon }}) center / contain no-repeat;-webkit-mask:url({{ e.icon }}) center / contain no-repeat;"></span>
    <input value="{{ e.nm.text }}" readOnly="{{ e.nm.readOnly }}" maxLength="60" spellCheck="false" title="Doble clic para editar" onDoubleClick="{{ e.nm.onDbl }}" onChange="{{ e.nm.onChange }}" onKeyDown="{{ e.nm.onKey }}" onBlur="{{ e.nm.onBlur }}" onMouseDown="{{ e.nm.onDown }}" class="entidad-cabecera-nombre" style="cursor:{{ e.nm.cursor }};box-shadow:{{ e.nm.underline }};">
    <sc-if value="{{ e.hasDec }}" hint-placeholder-val="{{ false }}"><button onClick="{{ e.toggleDec }}" title="Coma flotante" aria-pressed="{{ e.decimals }}" class="entidad-cabecera-coma-flotante" style="background:{{ e.decColor }};mask:url({{ e.decIcon }}) center / contain no-repeat;-webkit-mask:url({{ e.decIcon }}) center / contain no-repeat;"></button></sc-if>
    <sc-if value="{{ e.hasFx }}" hint-placeholder-val="{{ true }}"><button onClick="{{ e.toggleFx }}" aria-label="Función" aria-pressed="{{ e.showIn }}" title="{{ e.fxTitle }}" class="entidad-cabecera-funcion" style="background:{{ e.fxColor }};"></button></sc-if>
    <div data-entmenu="1" class="entidad-cabecera-menu">
      <button onClick="{{ e.toggleMenu }}" aria-label="Opciones de la entidad" aria-haspopup="menu" aria-expanded="{{ e.menuOpen }}" title="Opciones" class="entidad-cabecera-opciones-entidad" style="background:{{ e.menuDot }};"></button>
      <sc-if value="{{ e.menuOpen }}" hint-placeholder-val="{{ false }}">
        <div role="menu" class="entidad-cabecera-menu-2">
          <button role="menuitem" onClick="{{ e.duplicate }}" class="entidad-cabecera-opcion-menu">Duplicar entidad</button>
          <button role="menuitem" onClick="{{ e.remove }}" class="entidad-cabecera-opcion-menu">Borrar entidad</button>
        </div>
      </sc-if>
    </div>
  </div>
  <button onClick="{{ e.up }}" aria-label="Subir" class="entidad-cabecera-subir" style="background:{{ e.upColor }};"></button>
  <button onClick="{{ e.down }}" aria-label="Bajar" class="entidad-cabecera-bajar" style="background:{{ e.downColor }};"></button>
</x-dc>
