<!-- Componente "entidad-deslizador" de NoteApp. Entidad Deslizador.
     Los estilos fijos están en entidad-deslizador.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <sc-if value="{{ e.sliderClean }}" hint-placeholder-val="{{ false }}"><div class="entidad-deslizador-caja"><div class="entidad-deslizador-caja-2"><div class="entidad-deslizador-caja-3"><span title="{{ e.desc }}" class="entidad-deslizador-texto">{{ e.desc }}</span></div><div class="entidad-deslizador-caja-4">{{ e.out }}</div></div><div class="entidad-deslizador-caja-5"><span class="entidad-deslizador-texto-2">{{ e.minTxt }}</span><div onPointerDown="{{ e.slDown }}" onPointerMove="{{ e.slMove }}" onPointerUp="{{ e.slUp }}" onPointerCancel="{{ e.slUp }}" class="entidad-deslizador-caja-6"><span class="entidad-deslizador-texto-3" style="width:{{ e.fillW }};"></span><span class="entidad-deslizador-texto-4"></span></div><span class="entidad-deslizador-texto-2">{{ e.maxTxt }}</span></div></div></sc-if>
  <sc-if value="{{ e.sliderDirty }}" hint-placeholder-val="{{ false }}"><div class="entidad-deslizador-caja"><div class="entidad-deslizador-caja-2"><div class="entidad-deslizador-caja-7"><span class="entidad-deslizador-texto-5">{{ e.descSizer }}</span><input value="{{ e.desc }}" onChange="{{ e.onDesc }}" maxLength="120" spellCheck="false" class="entidad-deslizador-campo"></div><div class="entidad-deslizador-caja-8"></div><div class="entidad-deslizador-caja-4">{{ e.out }}</div></div><sc-if value="{{ e.showIn }}" hint-placeholder-val="{{ true }}"><div class="entidad-deslizador-caja-9"><div class="entidad-deslizador-caja-10"><div class="entidad-deslizador-caja-11" style="justify-content:{{ e.fMin.justify }};visibility:{{ e.fMin.hlVis }};text-decoration:{{ e.fMin.deco }};"><sc-for list="{{ e.fMin.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></div><input value="{{ e.fMin.value }}" spellCheck="false" onChange="{{ e.fMin.onChange }}" onFocus="{{ e.fMin.onFocus }}" onBlur="{{ e.fMin.onBlur }}" onKeyDown="{{ e.fMin.onKey }}" class="entidad-deslizador-campo-2" style="text-align:{{ e.fMin.align }};opacity:{{ e.fMin.inOp }};"></div><div class="entidad-deslizador-caja-10"><div class="entidad-deslizador-caja-11" style="justify-content:{{ e.fMax.justify }};visibility:{{ e.fMax.hlVis }};text-decoration:{{ e.fMax.deco }};"><sc-for list="{{ e.fMax.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></div><input value="{{ e.fMax.value }}" spellCheck="false" onChange="{{ e.fMax.onChange }}" onFocus="{{ e.fMax.onFocus }}" onBlur="{{ e.fMax.onBlur }}" onKeyDown="{{ e.fMax.onKey }}" class="entidad-deslizador-campo-2" style="text-align:{{ e.fMax.align }};opacity:{{ e.fMax.inOp }};"></div></div></sc-if><sc-if value="{{ e.showOut }}" hint-placeholder-val="{{ false }}"><div class="entidad-deslizador-caja-5"><span class="entidad-deslizador-texto-2">{{ e.minTxt }}</span><div onPointerDown="{{ e.slDown }}" onPointerMove="{{ e.slMove }}" onPointerUp="{{ e.slUp }}" onPointerCancel="{{ e.slUp }}" class="entidad-deslizador-caja-6"><span class="entidad-deslizador-texto-3" style="width:{{ e.fillW }};"></span><span class="entidad-deslizador-texto-4"></span></div><span class="entidad-deslizador-texto-2">{{ e.maxTxt }}</span></div></sc-if></div></sc-if>
</x-dc>
