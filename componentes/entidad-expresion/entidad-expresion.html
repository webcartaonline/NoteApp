<!-- Componente "entidad-expresion" de NoteApp. Entidad Expresión: fórmula y resultado.
     Los estilos fijos están en entidad-expresion.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <sc-if value="{{ e.exprClean }}" hint-placeholder-val="{{ false }}"><div class="entidad-expresion-caja"><div class="entidad-expresion-caja-2"><span title="{{ e.desc }}" class="entidad-expresion-texto">{{ e.desc }}</span></div><div class="entidad-expresion-caja-3">{{ e.out }}</div></div></sc-if>
  <sc-if value="{{ e.exprDirty }}" hint-placeholder-val="{{ false }}"><div class="entidad-expresion-caja"><div class="entidad-expresion-caja-4"><span class="entidad-expresion-texto-2">{{ e.descSizer }}</span><input value="{{ e.desc }}" onChange="{{ e.onDesc }}" maxLength="120" spellCheck="false" class="entidad-expresion-campo"></div><div class="entidad-expresion-caja-5"><sc-if value="{{ e.showIn }}" hint-placeholder-val="{{ true }}"><div class="entidad-expresion-caja-6"><div class="entidad-expresion-caja-7" style="justify-content:{{ e.fx.justify }};visibility:{{ e.fx.hlVis }};text-decoration:{{ e.fx.deco }};"><sc-for list="{{ e.fx.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></div><input value="{{ e.fx.value }}" spellCheck="false" onChange="{{ e.fx.onChange }}" onFocus="{{ e.fx.onFocus }}" onBlur="{{ e.fx.onBlur }}" onKeyDown="{{ e.fx.onKey }}" class="entidad-expresion-campo-2" style="text-align:{{ e.fx.align }};opacity:{{ e.fx.inOp }};"></div></sc-if><sc-if value="{{ e.showOut }}" hint-placeholder-val="{{ false }}"><div class="entidad-expresion-caja-8"><sc-if value="{{ e.hasSubst }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ e.subst }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for><span class="entidad-expresion-texto-3">=</span></sc-if><span class="entidad-expresion-texto-4">{{ e.out }}</span></div></sc-if></div></div></sc-if>
</x-dc>
