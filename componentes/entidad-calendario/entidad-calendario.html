<!-- Componente "entidad-calendario" de NoteApp. Entidad Calendario (fecha, hora y rangos).
     Los estilos fijos están en entidad-calendario.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <div class="entidad-calendario-caja"><div class="entidad-calendario-caja-2"><sc-if value="{{ e.entDirty }}" hint-placeholder-val="{{ false }}"><div class="entidad-calendario-caja-3"><span class="entidad-calendario-texto">{{ e.descSizer }}</span><input value="{{ e.desc }}" onChange="{{ e.onDesc }}" maxLength="120" spellCheck="false" class="entidad-calendario-campo"></div><div class="entidad-calendario-caja-4"></div></sc-if><sc-if value="{{ e.headClean }}" hint-placeholder-val="{{ false }}"><div class="entidad-calendario-caja-5"><span title="{{ e.desc }}" class="entidad-calendario-texto-2">{{ e.desc }}</span></div></sc-if><sc-if value="{{ e.entDirty }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="Tipo de fecha" class="entidad-calendario-tipo-fecha"><sc-for list="{{ e.kinds }}" as="m" hint-placeholder-count="2"><button role="radio" aria-checked="{{ m.on }}" onClick="{{ m.onClick }}" title="{{ m.title }}" class="entidad-calendario-opcion" style="background:{{ m.bg }};color:{{ m.color }};font:inherit;font-size:13px;font-weight:{{ m.fw }};">{{ m.label }}</button></sc-for></div></sc-if><sc-if value="{{ e.entDirty }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="Tipo de hora" class="entidad-calendario-tipo-fecha"><sc-for list="{{ e.tkinds }}" as="m" hint-placeholder-count="2"><button role="radio" aria-checked="{{ m.on }}" onClick="{{ m.onClick }}" title="{{ m.title }}" class="entidad-calendario-opcion" style="background:{{ m.bg }};color:{{ m.color }};font:inherit;font-size:13px;font-weight:{{ m.fw }};">{{ m.label }}</button></sc-for></div></sc-if><div class="entidad-calendario-caja-6">{{ e.outTxt }}</div></div><sc-if value="{{ e.hasHint }}" hint-placeholder-val="{{ false }}"><div class="entidad-calendario-caja-7">{{ e.hint }}</div></sc-if><div onMouseLeave="{{ e.calLeave }}" class="entidad-calendario-caja-8"><sc-for list="{{ e.cals }}" as="c" hint-placeholder-count="1"><div class="entidad-calendario-caja-9"><sc-if value="{{ c.hasLabel }}" hint-placeholder-val="{{ false }}"><span class="entidad-calendario-texto-3">{{ c.label }}</span></sc-if><div class="entidad-calendario-caja-10"><div class="entidad-calendario-caja-11"><button onClick="{{ c.prevMonth }}" aria-label="Mes anterior" title="Mes anterior" class="entidad-calendario-mes-anterior"><span class="entidad-calendario-texto-4"></span></button><span class="entidad-calendario-texto-5">{{ c.monthTxt }}</span><button onClick="{{ c.nextMonth }}" aria-label="Mes siguiente" title="Mes siguiente" class="entidad-calendario-mes-anterior"><span class="entidad-calendario-texto-6"></span></button></div><div class="entidad-calendario-caja-12"><sc-for list="{{ e.wdays }}" as="w" hint-placeholder-count="7"><span class="entidad-calendario-texto-7">{{ w.t }}</span></sc-for><sc-for list="{{ c.days }}" as="d" hint-placeholder-count="35"><button onClick="{{ d.onClick }}" onDoubleClick="{{ d.onDbl }}" title="{{ d.tip }}" aria-pressed="{{ d.sel }}" class="entidad-calendario-boton" style="background:{{ d.bg }};box-shadow:{{ d.ring }};color:{{ d.color }};font:inherit;font-size:14px;font-weight:{{ d.fw }};font-variant-numeric:tabular-nums;">{{ d.n }}{{ d.rippleEl }}</button></sc-for></div></div><span class="entidad-calendario-texto-8">{{ c.longDate }}</span><sc-if value="{{ c.hasTimes }}" hint-placeholder-val="{{ true }}"><div class="entidad-calendario-caja-13"><span class="entidad-calendario-texto-9">{{ c.timeLbl }}</span><sc-if value="{{ c.hasStart }}" hint-placeholder-val="{{ true }}"><input type="time" value="{{ c.time }}" onChange="{{ c.onTime }}" class="entidad-calendario-campo-time"></sc-if><sc-if value="{{ c.hasBoth }}" hint-placeholder-val="{{ false }}"><span class="entidad-calendario-texto-9">–</span></sc-if><sc-if value="{{ c.hasEnd }}" hint-placeholder-val="{{ false }}"><input type="time" value="{{ c.timeEnd }}" onChange="{{ c.onTimeEnd }}" class="entidad-calendario-campo-time"></sc-if><sc-if value="{{ c.hasToday }}" hint-placeholder-val="{{ true }}"><button onClick="{{ c.goToday }}" class="entidad-calendario-hoy">Hoy</button></sc-if></div></sc-if></div></sc-for></div></div>
</x-dc>
