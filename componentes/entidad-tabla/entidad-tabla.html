<!-- Componente "entidad-tabla" de NoteApp. Entidad Tabla: columnas, filas y operaciones.
     Los estilos fijos están en entidad-tabla.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <div class="entidad-tabla-caja"><div class="entidad-tabla-caja-2" style="grid-template-columns:{{ e.grid }};"><sc-for list="{{ e.cols }}" as="c" hint-placeholder-count="3"><div class="entidad-tabla-caja-3" style="justify-content:{{ c.justify }};"><span class="entidad-tabla-texto">{{ c.label }}</span><span class="entidad-tabla-texto-2" style="background:{{ c.bar }};"></span></div></sc-for></div><sc-for list="{{ e.rows }}" as="r" hint-placeholder-count="3"><div class="entidad-tabla-caja-4" style="grid-template-columns:{{ e.grid }};border-bottom:{{ r.border }};"><sc-for list="{{ r.cells }}" as="cell" hint-placeholder-count="3"><div class="entidad-tabla-caja-5" style="justify-content:{{ cell.justify }};border-left:{{ cell.bl }};padding:{{ cell.pad }};"><sc-if value="{{ cell.isBox }}" hint-placeholder-val="{{ false }}"><button onClick="{{ cell.onToggle }}" class="entidad-tabla-boton" style="background:{{ cell.chkBg }};"></button></sc-if><sc-if value="{{ cell.isText }}" hint-placeholder-val="{{ false }}"><span class="entidad-tabla-texto-3" style="color:{{ cell.color }};font-weight:{{ cell.fw }};text-decoration:{{ cell.deco }};text-overflow:ellipsis;">{{ cell.text }}</span></sc-if><sc-if value="{{ cell.isField }}" hint-placeholder-val="{{ false }}"><div class="entidad-tabla-caja-6"><div class="entidad-tabla-caja-7" style="justify-content:{{ cell.f.justify }};visibility:{{ cell.f.hlVis }};text-decoration:{{ cell.f.deco }};"><sc-for list="{{ cell.f.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></div><input value="{{ cell.f.value }}" spellCheck="false" onChange="{{ cell.f.onChange }}" onFocus="{{ cell.f.onFocus }}" onBlur="{{ cell.f.onBlur }}" onKeyDown="{{ cell.f.onKey }}" class="entidad-tabla-campo" style="text-align:{{ cell.f.align }};opacity:{{ cell.f.inOp }};"></div></sc-if></div></sc-for></div></sc-for><sc-if value="{{ e.showTotal }}" hint-placeholder-val="{{ false }}"><div class="entidad-tabla-caja-8" style="grid-template-columns:{{ e.grid }};"><sc-for list="{{ e.totals }}" as="tt" hint-placeholder-count="3"><div class="entidad-tabla-caja-9" style="justify-content:{{ tt.justify }};"><span class="entidad-tabla-texto-4">{{ tt.label }}</span><span class="entidad-tabla-texto-5">{{ tt.text }}</span></div></sc-for></div></sc-if><sc-if value="{{ e.tblEdit }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ e.rowAdders }}" as="a" hint-placeholder-count="0"><button onClick="{{ a.onClick }}" title="Añadir fila" class="entidad-tabla-anadir-fila" style="left:-31px;top:{{ a.top }};"><span class="entidad-tabla-texto-6"></span><span class="entidad-tabla-texto-7"></span></button></sc-for><div class="entidad-tabla-caja-10" style="grid-template-columns:{{ e.grid }};"><sc-for list="{{ e.cols }}" as="c" hint-placeholder-count="3"><div class="entidad-tabla-caja-11"><button onClick="{{ c.addLeft }}" title="Añadir columna" class="entidad-tabla-anadir-columna"><span class="entidad-tabla-texto-6"></span><span class="entidad-tabla-texto-7"></span></button><sc-if value="{{ c.isLast }}" hint-placeholder-val="{{ false }}"><button onClick="{{ c.addRight }}" title="Añadir columna" class="entidad-tabla-anadir-columna-2"><span class="entidad-tabla-texto-6"></span><span class="entidad-tabla-texto-7"></span></button></sc-if><button data-colmenu="1" onClick="{{ c.openMenu }}" title="Opciones de la columna" class="entidad-tabla-opciones-columna" style="background:{{ c.dotColor }};"></button><sc-if value="{{ c.menuOpen }}" hint-placeholder-val="{{ false }}"><div data-colmenu="1" class="entidad-tabla-menu-columna" style="top:30px;left:{{ c.mLeft }};right:{{ c.mRight }};transform:{{ c.mTf }};"><button onClick="{{ c.menu.remove }}" disabled="{{ c.menu.noRemove }}" aria-label="Eliminar columna" title="Eliminar columna" class="entidad-tabla-eliminar-columna" style="cursor:{{ c.menu.rmCursor }};opacity:{{ c.menu.rmOp }};"><span class="entidad-tabla-texto-8"></span></button><input value="{{ c.menu.title.text }}" readOnly="{{ c.menu.title.readOnly }}" maxLength="22" spellCheck="false" title="Doble clic para editar" onDoubleClick="{{ c.menu.title.onDbl }}" onChange="{{ c.menu.title.onChange }}" onKeyDown="{{ c.menu.title.onKey }}" onBlur="{{ c.menu.title.onBlur }}" onMouseDown="{{ c.menu.title.onDown }}" class="entidad-tabla-nombre" style="cursor:{{ c.menu.title.cursor }};box-shadow:{{ c.menu.title.underline }};"><sc-for list="{{ c.menu.ops }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.onClick }}" class="entidad-tabla-boton-2" style="background:{{ o.bg }};font:inherit;font-size:14px;font-weight:{{ o.fw }};">{{ o.label }}</button></sc-for><div class="entidad-tabla-caja-12"><sc-for list="{{ c.menu.pills }}" as="p" hint-placeholder-count="3"><button onClick="{{ p.onClick }}" title="{{ p.title }}" class="entidad-tabla-boton-3" style="background:{{ p.bg }};"></button></sc-for></div></div></sc-if></div></sc-for></div></sc-if></div>
</x-dc>
