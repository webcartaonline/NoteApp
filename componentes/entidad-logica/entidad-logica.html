<!-- Componente "entidad-logica" de NoteApp. Entidad Lógica: condiciones (si / si no) y salidas.
     Los estilos fijos están en entidad-logica.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <div class="entidad-logica-caja"><div class="entidad-logica-caja-2"><sc-if value="{{ e.entDirty }}" hint-placeholder-val="{{ false }}"><div class="entidad-logica-caja-3"><span class="entidad-logica-texto">{{ e.descSizer }}</span><input value="{{ e.desc }}" onChange="{{ e.onDesc }}" maxLength="120" spellCheck="false" class="entidad-logica-campo"></div><div class="entidad-logica-caja-4"></div><div role="radiogroup" aria-label="{{ e.cmpLabel }}" class="entidad-logica-grupo-opciones"><sc-for list="{{ e.cmps }}" as="m" hint-placeholder-count="6"><button role="radio" aria-checked="{{ m.on }}" onClick="{{ m.onClick }}" title="{{ m.title }}" class="entidad-logica-opcion" style="background:{{ m.bg }};color:{{ m.color }};font:inherit;font-size:13px;font-weight:{{ m.fw }};">{{ m.label }}</button></sc-for></div></sc-if><sc-if value="{{ e.logicHeadClean }}" hint-placeholder-val="{{ false }}"><div class="entidad-logica-caja-5"><span title="{{ e.desc }}" class="entidad-logica-texto-2">{{ e.desc }}</span></div></sc-if><div class="entidad-logica-caja-6">{{ e.outTxt }}</div></div><div class="entidad-logica-caja-7" style="grid-template-columns:{{ e.lgrid }};grid-auto-rows:{{ e.lrowH }};padding:{{ e.lpad }};"><sc-for list="{{ e.lrows }}" as="rw" hint-placeholder-count="1"><div onMouseDown="{{ rw.onDown }}" class="entidad-logica-caja-8"><sc-for list="{{ rw.parts }}" as="p" hint-placeholder-count="6"><sc-if value="{{ p.isLead }}" hint-placeholder-val="{{ false }}"><span class="entidad-logica-texto-3" style="color:{{ p.color }};font-weight:{{ p.fw }};">{{ p.text }}</span></sc-if><sc-if value="{{ p.isWord }}" hint-placeholder-val="{{ true }}"><span class="entidad-logica-texto-4">{{ p.text }}</span></sc-if><sc-if value="{{ p.isField }}" hint-placeholder-val="{{ false }}"><div title="{{ p.label }}" class="entidad-logica-caja-9" style="grid-column:{{ p.col }};"><div class="entidad-logica-caja-10"><div class="entidad-logica-caja-11" style="justify-content:{{ p.f.justify }};visibility:{{ p.f.hlVis }};text-decoration:{{ p.f.deco }};"><sc-for list="{{ p.f.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></div><input value="{{ p.f.value }}" spellCheck="false" onChange="{{ p.f.onChange }}" onFocus="{{ p.f.onFocus }}" onBlur="{{ p.f.onBlur }}" onKeyDown="{{ p.f.onKey }}" class="entidad-logica-campo-2" style="text-align:{{ p.f.align }};opacity:{{ p.f.inOp }};"></div></div></sc-if><sc-if value="{{ p.isVal }}" hint-placeholder-val="{{ false }}"><span title="{{ p.label }}" class="entidad-logica-texto-5" style="grid-column:{{ p.col }};"><sc-for list="{{ p.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></span></sc-if><sc-if value="{{ p.isDel }}" hint-placeholder-val="{{ false }}"><button onClick="{{ p.onClick }}" aria-label="Quitar caso" title="Quitar caso" class="entidad-logica-quitar-caso"><span class="entidad-logica-texto-6"></span></button></sc-if><sc-if value="{{ p.isAdd }}" hint-placeholder-val="{{ false }}"><button onClick="{{ p.onClick }}" aria-label="Añadir caso" title="Añadir caso «si no, si»" class="entidad-logica-anadir-caso"><span class="entidad-logica-texto-7"></span><span class="entidad-logica-texto-8"></span></button></sc-if></sc-for></div></sc-for></div></div>
</x-dc>
