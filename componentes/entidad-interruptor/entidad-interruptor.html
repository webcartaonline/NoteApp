<!-- Componente "entidad-interruptor" de NoteApp. Entidad Interruptor (y casilla True/False).
     Los estilos fijos están en entidad-interruptor.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <sc-if value="{{ e.toggleClean }}" hint-placeholder-val="{{ false }}"><div class="entidad-interruptor-caja"><button onClick="{{ e.onToggle }}" aria-pressed="{{ e.on }}" class="entidad-interruptor-boton" style="background:{{ e.boxBg }};"><span class="entidad-interruptor-texto" style="background:{{ e.chkBg }};"></span></button><div class="entidad-interruptor-caja-2" style="background:{{ e.rowBg }};"><div class="entidad-interruptor-caja-3"><span title="{{ e.desc }}" class="entidad-interruptor-texto-2">{{ e.desc }}</span></div><div class="entidad-interruptor-caja-4" style="background:{{ e.valBg }};">{{ e.out }}</div></div></div></sc-if>
  <sc-if value="{{ e.toggleDirty }}" hint-placeholder-val="{{ false }}"><div class="entidad-interruptor-caja"><button onClick="{{ e.onToggle }}" aria-pressed="{{ e.on }}" class="entidad-interruptor-boton" style="background:{{ e.boxBg }};"><span class="entidad-interruptor-texto" style="background:{{ e.chkBg }};"></span></button><div class="entidad-interruptor-caja-2" style="background:{{ e.rowBg }};"><div class="entidad-interruptor-caja-5"><span class="entidad-interruptor-texto-3">{{ e.descSizer }}</span><input value="{{ e.desc }}" onChange="{{ e.onDesc }}" maxLength="120" spellCheck="false" class="entidad-interruptor-campo"></div><div class="entidad-interruptor-caja-2" style="background:{{ e.valBg }};"><sc-if value="{{ e.showIn }}" hint-placeholder-val="{{ true }}"><div class="entidad-interruptor-caja-6"><div class="entidad-interruptor-caja-7" style="justify-content:{{ e.fx.justify }};visibility:{{ e.fx.hlVis }};text-decoration:{{ e.fx.deco }};"><sc-for list="{{ e.fx.segs }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for></div><input value="{{ e.fx.value }}" spellCheck="false" onChange="{{ e.fx.onChange }}" onFocus="{{ e.fx.onFocus }}" onBlur="{{ e.fx.onBlur }}" onKeyDown="{{ e.fx.onKey }}" class="entidad-interruptor-campo-2" style="text-align:{{ e.fx.align }};opacity:{{ e.fx.inOp }};"></div></sc-if><sc-if value="{{ e.showOut }}" hint-placeholder-val="{{ false }}"><div class="entidad-interruptor-caja-8"><sc-if value="{{ e.hasSubst }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ e.subst }}" as="s" hint-placeholder-count="1"><span style="color:{{ s.color }};">{{ s.text }}</span></sc-for><span class="entidad-interruptor-texto-4">=</span></sc-if><span class="entidad-interruptor-texto-5">{{ e.out }}</span></div></sc-if></div></div></div></sc-if>
</x-dc>
