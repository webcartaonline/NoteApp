<!-- Componente "cabecera" de NoteApp. Cabecera: título de la ventana (Notas / Agenda / Diagrama), pestañas de las notas (la elegida, con flechas para moverla) y botón para añadir una nota.
     Los estilos fijos están en cabecera.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <header class="cabecera-cabecera">
    <h1 class="cabecera-titulo">
      <sc-if value="{{ isNotas }}" hint-placeholder-val="{{ true }}">Notas</sc-if>
      <sc-if value="{{ isAgenda }}" hint-placeholder-val="{{ false }}">Agenda</sc-if>
      <sc-if value="{{ isDiagrama }}" hint-placeholder-val="{{ false }}">Diagrama</sc-if>
    </h1>
    <nav class="cabecera-navegacion">
      <div class="cabecera-caja">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
          <div data-note="{{ t.nid }}" class="cabecera-caja-2">
            <sc-if value="{{ t.canLeft }}" hint-placeholder-val="{{ false }}"><button onMouseDown="{{ t.noFocus }}" onClick="{{ t.moveLeft }}" aria-label="Mover nota a la izquierda" title="Mover a la izquierda" class="cabecera-mover-izquierda"></button></sc-if>
            <sc-if value="{{ t.canRight }}" hint-placeholder-val="{{ false }}"><button onMouseDown="{{ t.noFocus }}" onClick="{{ t.moveRight }}" aria-label="Mover nota a la derecha" title="Mover a la derecha" class="cabecera-mover-derecha"></button></sc-if>
            <span class="cabecera-texto" style="font-weight:{{ t.weight }};">{{ t.display }}</span>
            <input value="{{ t.text }}" readOnly="{{ t.readOnly }}" maxLength="22" spellCheck="false" title="Doble clic para editar" onDoubleClick="{{ t.onDbl }}" onChange="{{ t.onChange }}" onKeyDown="{{ t.onKey }}" onBlur="{{ t.onBlur }}" onMouseDown="{{ t.onDown }}" onClick="{{ t.onClick }}" class="cabecera-nombre" style="font:inherit;font-weight:{{ t.weight }};color:{{ t.color }};cursor:{{ t.cursor }};box-shadow:{{ t.underline }};">
          </div>
        </sc-for>
      </div>
      <button onClick="{{ addNote }}" title="Añadir nota" class="cabecera-anadir" aria-label="Añadir"></button>
    </nav>
  </header>
</x-dc>
