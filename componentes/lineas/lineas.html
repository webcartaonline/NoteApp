<!-- Componente "lineas" de NoteApp. Lista de líneas de texto con formato MKD. Se usa en el panel de texto y en la entidad Texto (recibe la lista en "list").
     Los estilos fijos están en lineas.css; los que cambian ({{ }}) siguen aquí.
     Los valores {{ }} vienen de renderVals() (js/app/render.js). -->
<x-dc>
  <sc-for list="{{ list }}" as="ln" hint-placeholder-count="4">
    <div data-line="1" data-lid="{{ ln.id }}" onMouseDown="{{ ln.onDown }}" class="lineas-linea" style="margin-top:{{ ln.mt }};padding:{{ ln.pad }};background:{{ ln.bg }};border-radius:{{ ln.rad }};box-shadow:{{ ln.bar }};font-family:{{ ln.ff }};font-size:{{ ln.fs }};line-height:{{ ln.lh }};font-weight:{{ ln.fw }};color:{{ ln.color }};">
      <sc-if value="{{ ln.isHr }}" hint-placeholder-val="{{ false }}"><div class="lineas-caja"><span class="lineas-texto"></span></div></sc-if>
      <sc-if value="{{ ln.hasMarker }}" hint-placeholder-val="{{ false }}"><span class="lineas-texto-2" style="top:{{ ln.mkTop }};left:{{ ln.mkLeft }};">{{ ln.marker }}</span></sc-if>
      <sc-if value="{{ ln.hasCopy }}" hint-placeholder-val="{{ false }}"><button onClick="{{ ln.onCopy }}" aria-label="Copiar contenido" title="{{ ln.copyTitle }}" class="lineas-copiar-contenido"><span class="lineas-texto-3" style="background:{{ ln.copyColor }};"></span></button></sc-if><sc-if value="{{ ln.isRow }}" hint-placeholder-val="{{ false }}"><div class="lineas-caja-2" style="grid-template-columns:{{ ln.cols }};"><sc-for list="{{ ln.cells }}" as="c" hint-placeholder-count="2"><div class="lineas-caja-3" style="text-align:{{ c.align }};font-weight:{{ c.fw }};"><sc-for list="{{ c.segs }}" as="sg" hint-placeholder-count="1"><sc-if value="{{ sg.isText }}" hint-placeholder-val="{{ true }}"><span data-off="{{ sg.off }}" style="color:{{ sg.color }};font-weight:{{ sg.fw }};font-style:{{ sg.fst }};text-decoration:{{ sg.td }};">{{ sg.text }}</span></sc-if><sc-if value="{{ sg.isLink }}" hint-placeholder-val="{{ false }}"><a href="{{ sg.href }}" target="_blank" rel="noopener noreferrer" data-off="{{ sg.off }}" class="lineas-enlace" style="color:#fff;font-weight:{{ sg.fw }};font-style:{{ sg.fst }};text-decoration:{{ sg.td }};text-decoration-color:#008000;text-decoration-thickness:2px;text-underline-offset:3px;">{{ sg.text }}</a></sc-if><sc-if value="{{ sg.isCode }}" hint-placeholder-val="{{ false }}"><code data-off="{{ sg.off }}" class="lineas-codigo" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:0.88em;font-weight:{{ sg.fw }};font-style:{{ sg.fst }};text-decoration:{{ sg.td }};">{{ sg.text }}</code></sc-if><sc-if value="{{ sg.isImg }}" hint-placeholder-val="{{ false }}"><img loading="lazy" src="{{ sg.src }}" alt="{{ sg.alt }}" title="{{ sg.alt }}" class="lineas-imagen"></sc-if><sc-if value="{{ sg.isEnt }}" hint-placeholder-val="{{ false }}"><span title="{{ sg.title }}" class="lineas-texto-4" style="padding:{{ sg.pad }};"><span data-off="{{ sg.off }}" class="lineas-texto-5">{{ sg.eq }}</span><span data-off="{{ sg.off2 }}" class="lineas-texto-6" style="font-weight:{{ sg.fw }};font-style:{{ sg.fst }};text-decoration:{{ sg.td }};">{{ sg.label }}</span></span></sc-if><sc-if value="{{ sg.isBox }}" hint-placeholder-val="{{ false }}"><span onMouseDown="{{ sg.onToggle }}" role="checkbox" aria-checked="{{ sg.on }}" class="lineas-casilla" style="margin-right:{{ sg.mr }};background:{{ sg.bg }};"></span></sc-if></sc-for>&#8203;</div></sc-for></div></sc-if>
      <sc-if value="{{ ln.showText }}" hint-placeholder-val="{{ true }}"><div class="lineas-caja-4" style="min-height:{{ ln.lh }};"><sc-for list="{{ ln.segs }}" as="sg" hint-placeholder-count="1"><sc-if value="{{ sg.isText }}" hint-placeholder-val="{{ true }}"><span data-off="{{ sg.off }}" style="color:{{ sg.color }};font-weight:{{ sg.fw }};font-style:{{ sg.fst }};text-decoration:{{ sg.td }};">{{ sg.text }}</span></sc-if><sc-if value="{{ sg.isLink }}" hint-placeholder-val="{{ false }}"><a href="{{ sg.href }}" target="_blank" rel="noopener noreferrer" data-off="{{ sg.off }}" class="lineas-enlace" style="color:#fff;font-weight:{{ sg.fw }};font-style:{{ sg.fst }};text-decoration:{{ sg.td }};text-decoration-color:#008000;text-decoration-thickness:2px;text-underline-offset:3px;">{{ sg.text }}</a></sc-if><sc-if value="{{ sg.isCode }}" hint-placeholder-val="{{ false }}"><code data-off="{{ sg.off }}" class="lineas-codigo" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:0.88em;font-weight:{{ sg.fw }};font-style:{{ sg.fst }};text-decoration:{{ sg.td }};">{{ sg.text }}</code></sc-if><sc-if value="{{ sg.isImg }}" hint-placeholder-val="{{ false }}"><img loading="lazy" src="{{ sg.src }}" alt="{{ sg.alt }}" title="{{ sg.alt }}" class="lineas-imagen"></sc-if><sc-if value="{{ sg.isEnt }}" hint-placeholder-val="{{ false }}"><span title="{{ sg.title }}" class="lineas-texto-4" style="padding:{{ sg.pad }};"><span data-off="{{ sg.off }}" class="lineas-texto-5">{{ sg.eq }}</span><span data-off="{{ sg.off2 }}" class="lineas-texto-6" style="font-weight:{{ sg.fw }};font-style:{{ sg.fst }};text-decoration:{{ sg.td }};">{{ sg.label }}</span></span></sc-if><sc-if value="{{ sg.isBox }}" hint-placeholder-val="{{ false }}"><span onMouseDown="{{ sg.onToggle }}" role="checkbox" aria-checked="{{ sg.on }}" class="lineas-casilla" style="margin-right:{{ sg.mr }};background:{{ sg.bg }};"></span></sc-if></sc-for>&#8203;</div></sc-if>
      <sc-if value="{{ ln.focused }}" hint-placeholder-val="{{ false }}">
        <textarea ref="{{ taRef }}" rows="1" spellCheck="false" value="{{ ln.text }}" onChange="{{ ln.onChange }}" onKeyDown="{{ ln.onKey }}" onPaste="{{ ln.onPaste }}" onBlur="{{ ln.onBlur }}" class="lineas-area"></textarea>
      </sc-if>
    </div>
  </sc-for>
</x-dc>
